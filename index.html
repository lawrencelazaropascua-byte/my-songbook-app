<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Songbook Compiler & Auto-Chord Engine (Enhanced)</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-color: #0f766e;
            --chord-color: #be123c;
            --border-color: #cbd5e1;
            --top-panel-bg: #1e293b;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        h1 {
            font-size: 1.3rem;
            color: var(--accent-color);
        }

        .top-control-panel {
            background-color: var(--top-panel-bg);
            color: #f8fafc;
            padding: 1rem;
            border-bottom: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex: 1;
            min-width: 200px;
        }

        .control-group label {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-inline-group {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }

        button, select, input {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            border-radius: 0.375rem;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .top-control-panel input, 
        .top-control-panel select {
            background-color: #334155;
            border: 1px solid #475569;
            color: white;
        }

        .top-control-panel input::placeholder {
            color: #94a3b8;
        }

        button {
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover {
            background-color: #f8fafc;
            border-color: #94a3b8;
        }

        .search-btn { background-color: var(--accent-color); color: white; border: none; }
        .wizard-btn { background-color: #d97706; color: white; border: none; }
        .primary-btn { background-color: #4f46e5; color: white; border: none; }
        .secondary-btn { background-color: #64748b; color: white; border: none; }
        .success-btn { background-color: var(--success-color); color: white; border: none; }

        .disclaimer-box {
            background-color: #fffbeb;
            border: 1px solid #f59e0b;
            color: #92400e;
            padding: 10px;
            font-size: 0.75rem;
            margin: 10px;
            border-radius: 4px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .editor-pane, .preview-pane {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .editor-pane {
            background-color: #1e1e1e;
            border-bottom: 1px solid var(--border-color);
        }

        .pane-title {
            padding: 0.5rem 1rem;
            background-color: #0f172a;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            width: 100%;
            flex-grow: 1;
            padding: 1rem;
            border: none;
            resize: vertical;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            line-height: 1.5;
            background-color: #1e1e1e;
            color: #d4d4d4;
            outline: none;
        }

        .preview-content {
            padding: 1.5rem;
            background-color: var(--card-bg);
        }

        .song-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.25rem; color: #0f172a; }
        .song-meta { font-style: italic; color: #64748b; margin-bottom: 1.5rem; font-size: 0.95rem; }
        .song-line { display: flex; flex-wrap: wrap; margin-bottom: 1rem; line-height: 2.6; }
        .chord-wrap { position: relative; display: inline-block; margin-right: 0.25rem; }
        
        .chord {
            position: absolute;
            top: -1.3rem;
            left: 0;
            font-weight: bold;
            color: var(--chord-color);
            font-family: "Courier New", Courier, monospace;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .lyrics { white-space: pre; font-size: 1rem; color: var(--text-color); }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }

        @media (min-width: 1024px) {
            body { height: 100vh; overflow: hidden; }
            .main-container { flex-direction: row; overflow: hidden; }
            .editor-pane, .preview-pane { flex: 1; height: 100%; overflow: hidden; }
            .editor-pane { border-right: 1px solid var(--border-color); border-bottom: none; }
            textarea { height: 100%; resize: none; }
            .preview-content { overflow-y: auto; height: 100%; padding: 2.5rem; }
        }

        @media print {
            header, .top-control-panel, .pane-title, .disclaimer-box { display: none !important; }
            .main-container, body { height: auto; overflow: visible; background: white; }
            .preview-pane { width: 100%; overflow: visible; }
            .preview-content { padding: 0; overflow: visible; }
            .song-line { page-break-inside: avoid; }
            .chord { color: black !important; }
        }
    </style>
</head>
<body>

    <header>
        <h1>📖 Auto-Chord Engine (Enhanced)</h1>
        <div style="display: flex; gap: 0.5rem;">
            <button class="secondary-btn" onclick="clearEditor()">🗑️ Clear</button>
            <button class="primary-btn" onclick="window.print()">🖨️ Print / PDF</button>
        </div>
    </header>

    <div class="top-control-panel">
        <div class="control-row">
            <div class="control-group" style="flex: 2;">
                <label>1. Fetch Lyrics Online</label>
                <form class="input-inline-group" onsubmit="event.preventDefault(); searchOnlineSong();">
                    <input type="text" id="search-artist" placeholder="Artist Name (Optional)" style="width: 40%;">
                    <input type="text" id="search-title" placeholder="Song Title" style="width: 40%;">
                    <button type="submit" class="search-btn">🔍 Search</button>
                </form>
            </div>
            <div class="control-group" style="flex: 1.5;">
                <label>2. Auto-Chord Injector</label>
                <div class="input-inline-group">
                    <select id="chord-progression" style="width: 65%;">
                        <option value="C,G,Am,F">Pop (C - G - Am - F)</option>
                        <option value="G,D,Em,C">Rock (G - D - Em - C)</option>
                        <option value="Am,F,C,G">Minor Pop (Am - F - C - G)</option>
                        <option value="A,D,E,D">Blues/Rock (A - D - E - D)</option>
                        <option value="Cm,Ab,Eb,Bb">Jazz Minor (Cm - Ab - Eb - Bb)</option>
                    </select>
                    <button class="wizard-btn" onclick="autoInjectChordTemplate()">🪄 Inject</button>
                </div>
            </div>
            <div class="control-group" style="flex: 0.5; min-width: 120px;">
                <label>Transpose Key</label>
                <select id="transpose" onchange="renderSong()">
                    <option value="0">Original</option>
                    <option value="1">+1</option>
                    <option value="2">+2</option>
                    <option value="3">+3</option>
                    <option value="4">+4</option>
                    <option value="5">+5</option>
                    <option value="-1">-1</option>
                    <option value="-2">-2</option>
                    <option value="-3">-3</option>
                    <option value="-4">-4</option>
                    <option value="-5">-5</option>
                </select>
            </div>
            <div class="control-group" style="flex: 1;">
                <label>Presets</label>
                <select id="song-presets" onchange="loadPresetSong()">
                    <option value="0">Amazing Grace (Demo)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="editor-pane">
            <div class="pane-title">
                ChordPro Editor (Type brackets here)
                <button class="secondary-btn" style="font-size: 0.8rem; padding: 0.25rem 0.5rem;" onclick="copyToClipboard()">📋 Copy Output</button>
            </div>
            <textarea id="chordpro-input" oninput="renderSong()" placeholder="Search a song above, then hit Inject Template!"></textarea>
            
            <div class="disclaimer-box">
                All lyrics provided on this website are the property of their respective owners and are intended for educational and personal use only.
            </div>
        </div>

        <div class="preview-pane">
            <div class="pane-title">Compiled Song Output</div>
            <div class="preview-content" id="preview-output"></div>
        </div>
    </div>

    <div id="toast" class="toast">Copied to clipboard!</div>

    <script>
        const localSongs = [{ title: "Amazing Grace", artist: "Traditional", chordpro: "{title: Amazing Grace}\n{artist: Traditional}\n\n[G]Amazing grace! How [C]sweet the [G]sound\nThat saved a wretch like [D]me!" }];
        const scale = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const flatMap = { "Db": "C#", "Eb": "D#", "Gb": "F#", "Ab": "G#", "Bb": "A#" };

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 3000);
        }

        function clearEditor() {
            if (confirm("Are you sure you want to clear the editor?")) {
                document.getElementById("chordpro-input").value = "";
                renderSong();
            }
        }

        function copyToClipboard() {
            const output = document.getElementById("preview-output").innerText;
            navigator.clipboard.writeText(output).then(() => {
                showToast("Output copied to clipboard!");
            }).catch(err => {
                showToast("Failed to copy: " + err);
            });
        }

        function autoInjectChordTemplate() {
            const editor = document.getElementById("chordpro-input");
            const progressionStr = document.getElementById("chord-progression").value;
            const chords = progressionStr.split(",");
            let lines = editor.value.split("\n");
            let chordIndex = 0;
            let outputLines = [];

            lines.forEach(line => {
                let trimmed = line.trim();
                if (trimmed.startsWith("{") || trimmed.startsWith("#") || trimmed === "") {
                    outputLines.push(line);
                    return;
                }
                if (trimmed.includes("[") && trimmed.includes("]")) {
                    outputLines.push(line);
                    return;
                }
                let words = trimmed.split(" ");
                if (words.length > 0 && words[0] !== "") {
                    // Inject chord at the first word
                    words[0] = `[${chords[chordIndex % chords.length]}]` + words[0];
                    chordIndex++;
                    
                    // Optional: Inject mid-line chord for longer lines
                    if (words.length > 4) {
                        let midPoint = Math.floor(words.length / 2);
                        words[midPoint] = `[${chords[chordIndex % chords.length]}]` + words[midPoint];
                        chordIndex++;
                    }
                    outputLines.push(words.join(" "));
                } else {
                    outputLines.push(line);
                }
            });
            editor.value = outputLines.join("\n");
            renderSong();
        }
