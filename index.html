<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Formatter (Safe)</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-color: #0f766e;
            --chord-color: #be123c;
            --border-color: #cbd5e1;
            --top-panel-bg: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; }
        
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.3rem; color: var(--accent-color); }
        
        .top-control-panel { background: var(--top-panel-bg); color: #f8fafc; padding: 1rem; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 1rem; }
        .control-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
        .control-group { display: flex; flex-direction: column; gap: 0.35rem; flex: 1; min-width: 200px; }
        .control-group label { font-size: 0.75rem; color: #94a3b8; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; }
        .input-inline-group { display: flex; gap: 0.5rem; width: 100%; }
        
        button, select, input { padding: 0.5rem 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem; font-weight: 500; font-size: 0.9rem; transition: all 0.2s; }
        .top-control-panel input, .top-control-panel select { background-color: #334155; border: 1px solid #475569; color: white; }
        button { cursor: pointer; white-space: nowrap; }
        button:hover { background-color: #f8fafc; border-color: #94a3b8; }
        
        .wizard-btn { background-color: #d97706; color: white; border: none; }
        .primary-btn { background-color: #4f46e5; color: white; border: none; }
        .secondary-btn { background-color: #64748b; color: white; border: none; }

        .main-container { display: flex; flex-direction: column; flex: 1; }
        .editor-pane, .preview-pane { width: 100%; display: flex; flex-direction: column; }
        .editor-pane { background-color: #1e1e1e; border-bottom: 1px solid var(--border-color); }
        
        .pane-title { padding: 0.5rem 1rem; background-color: #0f172a; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
        
        textarea { width: 100%; flex-grow: 1; padding: 1rem; border: none; resize: vertical; font-family: "Courier New", monospace; font-size: 1rem; line-height: 1.5; background-color: #1e1e1e; color: #d4d4d4; outline: none; }
        
        .preview-content { padding: 2rem; background-color: var(--card-bg); overflow-y: auto; }
        .song-title { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; color: #0f172a; }
        .song-meta { font-style: italic; color: #64748b; margin-bottom: 2rem; font-size: 1rem; }
        .song-line { display: flex; flex-wrap: wrap; margin-bottom: 1.2rem; line-height: 2.8; font-size: 1.1rem; }
        .chord-wrap { position: relative; display: inline-block; margin-right: 0.3rem; }
        .chord { position: absolute; top: -1.4rem; left: 0; font-weight: bold; color: var(--chord-color); font-family: monospace; font-size: 1rem; white-space: nowrap; }
        .lyrics { white-space: pre-wrap; color: var(--text-color); }
        
        .disclaimer {
            background-color: #fffbeb;
            border: 1px solid #f59e0b;
            color: #92400e;
            padding: 10px;
            font-size: 0.75rem;
            margin: 10px;
            border-radius: 4px;
            text-align: center;
        }

        @media (min-width: 1024px) {
            body { height: 100vh; overflow: hidden; }
            .main-container { flex-direction: row; overflow: hidden; }
            .editor-pane, .preview-pane { flex: 1; height: 100%; overflow: hidden; }
            .editor-pane { border-right: 1px solid var(--border-color); border-bottom: none; }
            textarea { height: 100%; resize: none; }
            .preview-content { overflow-y: auto; height: 100%; }
        }
        @media print {
            header, .top-control-panel, .pane-title, .disclaimer { display: none !important; }
            .main-container, body { height: auto; overflow: visible; }
            .preview-content { padding: 0; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎵 Chord Formatter</h1>
        <div style="display:flex; gap:0.5rem;">
            <button class="secondary-btn" onclick="clearEditor()">🗑️ Clear</button>
            <button class="primary-btn" onclick="window.print()">🖨️ Print</button>
        </div>
    </header>

    <div class="top-control-panel">
        <div class="control-row">
            <!-- REMOVED SEARCH SECTION FOR SAFETY -->
            
            <div class="control-group" style="flex: 1.5;">
                <label>2. Auto-Chord (Whole Song)</label>
                <div class="input-inline-group">
                    <select id="chord-progression">
                        <option value="C,G,Am,F">Pop (C-G-Am-F)</option>
                        <option value="G,D,Em,C">Rock (G-D-Em-C)</option>
                        <option value="Am,F,C,G">Sad Pop (Am-F-C-G)</option>
                        <option value="A,D,E,D">Blues (A-D-E-D)</option>
                        <option value="C,F,G,C">Classic (C-F-G-C)</option>
                    </select>
                    <button class="wizard-btn" onclick="injectWholeSongChords()">🪄 Inject All</button>
                </div>
            </div>
            <div class="control-group" style="flex: 0.5;">
                <label>Transpose</label>
                <select id="transpose" onchange="renderSong()">
                    <option value="0">Original</option>
                    <option value="1">+1</option><option value="2">+2</option><option value="3">+3</option>
                    <option value="4">+4</option><option value="5">+5</option>
                    <option value="-1">-1</option><option value="-2">-2</option><option value="-3">-3</option>
                </select>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="editor-pane">
            <div class="pane-title">Editor (Paste Lyrics Here)</div>
            <textarea id="chordpro-input" oninput="renderSong()" placeholder="Paste your lyrics here (e.g. from Google/Genius), then click 'Inject All' to add chords."></textarea>
            <div class="disclaimer">
                <strong>Note:</strong> This tool formats text you provide. It does not fetch lyrics. 
                Please ensure you have the right to use the lyrics you paste.
            </div>
        </div>
        <div class="preview-pane">
            <div class="pane-title">Preview</div>
            <div class="preview-content" id="preview-output"></div>
        </div>
    </div>

    <script>
        const scale = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const flatMap = { "Db": "C#", "Eb": "D#", "Gb": "F#", "Ab": "G#", "Bb": "A#" };

        function clearEditor() {
            if(confirm("Clear everything?")) {
                document.getElementById("chordpro-input").value = "";
                renderSong();
            }
        }

        function injectWholeSongChords() {
            const editor = document.getElementById("chordpro-input");
            const progressionStr = document.getElementById("chord-progression").value;
            const chords = progressionStr.split(",");
            let lines = editor.value.split("\n");
            let outputLines = [];
            let chordIndex = 0;

            lines.forEach(line => {
                const trimmed = line.trim();
                
                if (trimmed.startsWith("{") || trimmed === "" || trimmed.startsWith("#")) {
                    outputLines.push(line);
                    return;
                }

                if (trimmed.includes("[") && trimmed.includes("]")) {
                    outputLines.push(line);
                    return;
                }

                const words = trimmed.split(" ");
                if (words.length > 0 && words[0]) {
                    words[0] = `[${chords[chordIndex % chords.length]}]` + words[0];
                    chordIndex++;

                    if (words.length > 6) {
                        const mid = Math.floor(words.length / 2);
                        words[mid] = `[${chords[chordIndex % chords.length]}]` + words[mid];
                        chordIndex++;
                    }
                }
                outputLines.push(words.join(" "));
            });

            editor.value = outputLines.join("\n");
            renderSong();
        }

        function transposeChord(chord, semitones) {
            if (semitones === 0) return chord;
            return chord.replace(/[A-G][b#]?/g, (match) => {
                let normalized = flatMap[match] || match;
                let index = scale.indexOf(normalized);
                if (index === -1) return match;
                let newIndex = (index + semitones) % 12;
                if (newIndex < 0) newIndex += 12;
                return scale[newIndex];
            });
        }

        function renderSong() {
            const input = document.getElementById("chordpro-input").value;
            const outputElement = document.getElementById("preview-output");
            const transposeValue = parseInt(document.getElementById("transpose").value, 10);
            const lines = input.split("\n");
            let htmlOutput = "";
            let meta = { title: "Untitled", artist: "" };

            lines.forEach(line => {
                line = line.trim();
                
                if (line.startsWith("{") && line.endsWith("}")) {
                    const directive = line.slice(1, -1);
                    const colonIndex = directive.indexOf(":");
                    if (colonIndex !== -1) {
                        const key = directive.substring(0, colonIndex).trim().toLowerCase();
                        const value = directive.substring(colonIndex + 1).trim();
                        if (key === "title" || key === "t") meta.title = value;
                        if (key === "artist" || key === "a") meta.artist = value;
                    }
                    return;
                }

                if (line === "" || line.startsWith("#")) { 
                    htmlOutput += "<br>"; 
                    return; 
                }

                let lineHtml = '<div class="song-line">';
                const regex = /(\[[^\]]+\])?([^\[]*)/g;
                let match;
                while ((match = regex.exec(line)) !== null) {
                    let chord = match[1] ? match[1].slice(1, -1) : "";
                    let text = match[2] || "";
                    
                    if (chord) {
                        chord = transposeChord(chord, transposeValue);
                        lineHtml += `<span class="chord-wrap"><span class="chord">${chord}</span><span class="lyrics">${text || " "}</span></span>`;
                    } else if (text) {
                        lineHtml += `<span class="lyrics">${text}</span>`;
                    }
                }
                lineHtml += '</div>';
                htmlOutput += lineHtml;
            });

            outputElement.innerHTML = `
                <h2 class="song-title">${meta.title}</h2>
                ${meta.artist ? `<div class="song-meta">by ${meta.artist}</div>` : ''}
                ${htmlOutput}
            `;
        }

        window.onload = function() {
            document.getElementById("chordpro-input").value = "";
            renderSong();
        };
    </script>
</body>
</html>
